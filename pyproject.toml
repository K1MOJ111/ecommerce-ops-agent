[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-ops-agent"
version = "0.2.0"
description = "Ecommerce Ops Agent infrastructure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.38,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "pgvector>=0.5,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary]>=3.3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]
